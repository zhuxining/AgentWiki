[project]
name = "agentwiki"
version = "0.1.0"
description = "Local Markdown document store with SQLite keyword and semantic search"
readme = "README.md"
authors = [{ name = "zhuxining", email = "zhuxining@outlook.com" }]

requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "loguru>=0.7.3",
    "fastmcp >=4.0.3",
    "mcp[cli]>=2.2.0",
    "watchfiles>=1.2.0",
    "sqlite-vec>=0.1.9",
    "dformat>=0.1.2",
    "mdformat-gfm>=1.0.0",
    "mdformat-frontmatter>=2.1.2",
    "unidecode>=1.4.0",
]

[project.optional-dependencies]
semantic = ["fastembed>=0.7.4"]

[dependency-groups]
dev = ["ty>=0.0.79", "ruff>=0.16.6", "pytest-asyncio>=1.4.0", "pytest>=9.1.1"]

[project.scripts]
agentwiki = "agentwiki:main"
agentwiki-mcp = "agentwiki.mcp:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agentwiki"

# Ruff
[tool.ruff]
line-length = 100
fix = true
preview = true
unsafe-fixes = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "TID",  # tidy imports
    "PTH",  # pathlib
    "FLY",  # flynt-specific
    "RUF",  # Ruff-specific
    "FURB", # refurb specific
    "NPY",  # numpy-specific
    "PD",   # pandas-specific
]
ignore = [
    "unused-import",                     # module imported but unused (handled by pyflakes)
    "function-call-in-default-argument", # Typer calls in defaults (standard practice for Typer)
]
allowed-confusables = []
unfixable = []

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

# Pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"

pythonpath = "src"
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
addopts = ["--import-mode=importlib", "--strict-markers"]
markers = [
    "integration: marks tests that hit external services (deselect with '-m \"not integration\"')",
]
