[project]
name = "agentwiki"
version = "0.1.0"
description = "Local-first Markdown retrieval layer for AI agents"
readme = "README.md"
authors = [{ name = "zhuxining", email = "zhuxining@outlook.com" }]

requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.3",
    "typer>=0.27.2",
    "pydantic>=2.13.5",
    "loguru>=0.7.3",
    "fastmcp >=4.0.3",
    "watchfiles>=1.2.0",
    "sqlite-vec>=0.1.9",
    "mdformat>=0.1.2",
    "mdformat-gfm>=1.0.0",
    "mdformat-frontmatter>=2.1.2",
    "fastembed>=0.8.0",
    "aiosqlite>=0.22.1",
]

[dependency-groups]
dev = ["ty>=0.0.79", "ruff>=0.16.6", "pytest-asyncio>=1.4.0", "pytest>=9.1.1", "pytest-cov>=7.0.0"]

[project.scripts]
agentwiki = "agentwiki:main"
agentwiki-mcp = "agentwiki.mcp:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "agentwiki"
# Ships the default AGENTWIKI.md template used to bootstrap a new Wiki into the wheel.
source-include = ["src/agentwiki/data/**"]

# Ruff
[tool.ruff]
line-length = 100
preview = true
unsafe-fixes = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C4",   # flake8-comprehensions
    "DTZ",  # flake8-datetimez
    "I",    # isort
    "N",    # pep8-naming
    "W",    # pycodestyle warnings
    "TID",  # tidy imports
    "PTH",  # pathlib
    "FLY",  # flynt-specific
    "RUF",  # Ruff-specific
    "FURB", # refurb specific
    "NPY",  # numpy-specific
    "PD",   # pandas-specific
]
ignore = [
    # Typer declares CLI parameters via function defaults, which B008 flags by design.
    "function-call-in-default-argument",
]
allowed-confusables = ["，", "。", "、", "；", "：", "（", "）", "！", "？"]
unfixable = []

[tool.ruff.lint.isort]
combine-as-imports = true
force-sort-within-sections = true

# Pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"

pythonpath = ["src", "."]
testpaths = ["tests"]
log_cli = true
log_cli_level = "INFO"
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    # Coverage gate: a regression floor set a little below the current 90.7% so noisy
    # platform differences do not fail CI, but a real drop does.
    "--cov=agentwiki",
    "--cov-report=term-missing:skip-covered",
    "--cov-fail-under=88",
]
filterwarnings = [
    # fastembed changed this model's pooling from CLS to mean; we have no prior
    # embeddings to stay compatible with, so the new (documented) behaviour is what we
    # want. Pinning fastembed to 0.5.1 would only freeze an older, worse default.
    "ignore:The model .* now uses mean pooling:UserWarning",
]
markers = [
    "integration: marks tests that hit external services (deselect with '-m \"not integration\"')",
]
