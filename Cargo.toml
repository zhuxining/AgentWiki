[package]
name = "agentwiki"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Local-first Markdown knowledge base context retrieval for AI agents"
repository = "https://github.com/zhuxining/AgentWiki"
keywords = ["markdown", "wiki", "retrieval", "search", "mcp"]
categories = ["command-line-utilities"]

[lib]
name = "agentwiki"
path = "src/lib.rs"

[[bin]]
name = "agentwiki"
path = "src/cli.rs"

[[bin]]
name = "agentwiki-mcp"
path = "src/mcp.rs"

# ---------------------------------------------------------------------------
# Core runtime, config, error handling
# ---------------------------------------------------------------------------
[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "fs",
    "time",
    "signal",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
camino = { version = "1", features = ["serde1"] }
dirs = "7"

# ---------------------------------------------------------------------------
# Data & IO
# ---------------------------------------------------------------------------
sha2 = "0.11"
hex = "0.4"
pulldown-cmark = "0.13"
fs2 = "0.4"
tempfile = "3"

# ---------------------------------------------------------------------------
# Retrieval (embedded LanceDB + local embeddings)
# ---------------------------------------------------------------------------
lancedb = { version = "0.39", features = ["remote"] }
lance-index = "12"
arrow-array = "58"
arrow-schema = "58"
futures = "0.3"
fastembed = "7"
text-splitter = { version = "0.32", features = ["markdown"] }
globset = "0.4"
dprint-plugin-markdown = "0.24"

# ---------------------------------------------------------------------------
# CLI / MCP entry points
# ---------------------------------------------------------------------------
clap = { version = "4", features = ["derive", "env"] }
rmcp = { version = "3.4", optional = true, features = [
    "server",
    "transport-io",
] }
schemars = { version = "1", optional = true }

[features]
default = ["mcp"]
mcp = ["dep:rmcp", "dep:schemars"]

[dev-dependencies]

[profile.release]
lto = "thin"
codegen-units = 1
