[package]
name = "agentwiki"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Local-first Markdown knowledge base context retrieval for AI agents"
repository = "https://github.com/zhuxining/AgentWiki"
keywords = ["markdown", "wiki", "retrieval", "search", "mcp"]
categories = ["command-line-utilities"]

[lib]
name = "agentwiki"
path = "src/lib.rs"

[[bin]]
name = "agentwiki"
path = "src/bin/agentwiki.rs"

[[bin]]
name = "agentwiki-mcp"
path = "src/bin/agentwiki-mcp.rs"

# ---------------------------------------------------------------------------
# Core runtime, config, error handling
# ---------------------------------------------------------------------------
[dependencies]
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "fs",
    "time",
    "signal",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
anyhow = "1"
camino = { version = "1", features = ["serde1"] }
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ---------------------------------------------------------------------------
# Data & IO
# ---------------------------------------------------------------------------
sha2 = "0.10"
hex = "0.4"
pulldown-cmark = "0.13"
rusqlite = { version = "0.40", features = ["bundled"] }
fs2 = "0.4"
tempfile = "3"
time = { version = "0.3", features = ["formatting"] }

# ---------------------------------------------------------------------------
# Retrieval (embedded LanceDB + local embeddings)
# ---------------------------------------------------------------------------
lancedb = { version = "0.38", features = ["remote"] }
lance-index = "11"
arrow-array = "58"
arrow-schema = "58"
futures = "0.3"
fastembed = "6"
text-splitter = { version = "0.27", features = ["markdown"] }
walkdir = "2"
globset = "0.4"
dprint-plugin-markdown = "0.22"

# ---------------------------------------------------------------------------
# CLI / MCP entry points
# ---------------------------------------------------------------------------
clap = { version = "4", features = ["derive", "env"] }

# MCP server SDK — kept behind the `mcp` feature so the core library stays
# SDK-free and the ecosystem churn does not block the rest of the workspace.
rmcp = { version = "3.3", optional = true, features = ["server", "transport-io"] }
schemars = { version = "1", optional = true }

[features]
default = []
mcp = ["dep:rmcp", "dep:schemars"]

[dev-dependencies]

[profile.release]
lto = "thin"
codegen-units = 1
